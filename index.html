<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>健身菜單 & 動作庫</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --line:#334155;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --good:#22c55e; --danger:#ef4444; --chip:#1e3a5f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",Roboto,sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
    padding-bottom:76px;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(15,23,42,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-size:17px; margin:0; font-weight:700;}
  .hbtns{display:flex; gap:8px;}
  main{padding:16px; max-width:720px; margin:0 auto;}
  h2.sec{font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:20px 0 10px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-size:14px;}
  .btn{background:var(--panel2); color:var(--text); padding:8px 12px;}
  .btn.primary{background:var(--accent2); color:#022; font-weight:700;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--muted); padding:7px 11px;}
  .btn.sm{padding:5px 9px; font-size:13px;}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
  input,select,textarea{
    font-family:inherit; font-size:15px; width:100%; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical; min-height:60px;}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 5px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .row{display:flex; gap:8px; align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .spacer{flex:1;}
  .muted{color:var(--muted);}
  .small{font-size:13px;}
  .chip{display:inline-flex; align-items:center; gap:4px; background:var(--chip); color:var(--accent);
    padding:3px 9px; border-radius:999px; font-size:12px; white-space:nowrap;}
  .chip.eq{background:#3b2f1e; color:#fbbf24;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
    background:var(--panel); border-top:1px solid var(--line);
  }
  .tabbar button{flex:1; background:transparent; color:var(--muted); padding:11px 0 max(11px,env(safe-area-inset-bottom));
    font-size:12px; display:flex; flex-direction:column; align-items:center; gap:3px; border-radius:0;}
  .tabbar button.active{color:var(--accent);}
  .tabbar .ic{font-size:20px; line-height:1;}
  .empty{text-align:center; color:var(--muted); padding:40px 20px;}
  .empty .big{font-size:40px; margin-bottom:8px;}
  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40; display:none; align-items:flex-end; justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:var(--bg); width:100%; max-width:720px; max-height:92vh; overflow:auto;
    border-radius:18px 18px 0 0; border:1px solid var(--line); border-bottom:none; padding:18px 16px calc(24px + env(safe-area-inset-bottom));}
  .sheet h3{margin:0 0 4px; font-size:18px;}
  .sheethead{display:flex; align-items:center; margin-bottom:6px;}
  .filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; -webkit-overflow-scrolling:touch;}
  .filters::-webkit-scrollbar{display:none;}
  .fchip{white-space:nowrap; background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:6px 12px; border-radius:999px; font-size:13px;}
  .fchip.on{background:var(--accent2); color:#022; border-color:var(--accent2); font-weight:600;}
  .ex-item{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
  .ex-item:last-child{border-bottom:none;}
  .ex-name{font-weight:600;}
  .thumb{width:48px; height:48px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--panel2);}
  .thumb-ph{display:flex; align-items:center; justify-content:center; font-size:22px;}
  /* library groups */
  details.grp{padding:0; position:relative; margin-bottom:10px;}
  details.grp summary{list-style:none; cursor:pointer; padding:14px; display:flex; align-items:center; gap:10px;}
  details.grp summary::-webkit-details-marker{display:none;}
  details.grp summary::after{content:"▾"; color:var(--muted); transition:transform .2s; margin-left:2px;}
  details.grp[open] summary::after{transform:rotate(180deg);}
  .grp-ic{font-size:20px;}
  .grp-name{font-weight:700; font-size:16px;}
  .grp-count{background:var(--panel2); color:var(--muted); font-size:12px; font-weight:600; padding:1px 9px; border-radius:999px; margin-left:auto;}
  .grp-body{border-top:1px solid var(--line); padding:2px 14px 6px;}
  .ex-row{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .ex-row:last-child{border-bottom:none;}
  .ex-row:active{opacity:.6;}
  .ex-meta{color:var(--muted); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chev{color:var(--muted); font-size:22px; flex-shrink:0;}
  /* exercise detail view */
  .v-img{width:100%; max-height:280px; object-fit:cover; border-radius:12px; display:block;}
  .v-video{display:block; text-align:center; text-decoration:none;}
  .v-notes{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:10px; padding:12px 14px; margin-top:12px; line-height:1.7; font-size:14px;}
  .v-notes-h{font-size:12px; color:var(--muted); margin-bottom:6px; letter-spacing:.03em;}
  .imgprev{width:100%; max-height:200px; object-fit:cover; border-radius:12px; margin-top:8px; display:block;}
  .imgrow{display:flex; gap:8px; align-items:center; margin-top:6px;}
  .link{color:var(--accent); text-decoration:none;}
  .setrow{display:grid; grid-template-columns:1fr 70px 70px auto; gap:8px; align-items:center; margin-bottom:8px;}
  .setrow input{padding:8px; text-align:center;}
  .setrow .nm{text-align:left; font-weight:600;}
  .pick{display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .pick input[type=checkbox]{width:20px; height:20px;}
  .fab{position:fixed; right:16px; bottom:calc(72px + env(safe-area-inset-bottom)); z-index:25;
    width:56px; height:56px; border-radius:50%; background:var(--accent2); color:#022; font-size:28px;
    box-shadow:0 6px 20px rgba(14,165,233,.4); display:flex; align-items:center; justify-content:center; font-weight:300;}
  .tagline{color:var(--muted); font-size:13px; margin-top:2px;}
  .divide{height:1px; background:var(--line); margin:14px 0;}
  .badge{font-size:11px; color:var(--muted);}
  .day-item{display:flex; align-items:baseline; gap:8px; padding:6px 0;}
  .day-item .n{font-weight:600;}
  .day-item .d{color:var(--muted); font-size:13px;}
  /* framework */
  .fw-intro{color:var(--muted); font-size:13px; line-height:1.6; margin-bottom:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  details.fw{padding:0; overflow:hidden;}
  details.fw summary{list-style:none; cursor:pointer; padding:14px; display:flex; flex-direction:column; gap:4px;}
  details.fw summary::-webkit-details-marker{display:none;}
  details.fw summary::after{content:"▾"; position:absolute; right:16px; color:var(--muted); transition:transform .2s;}
  details.fw{position:relative;}
  details.fw[open] summary::after{transform:rotate(180deg);}
  .fw-zone{font-weight:700; font-size:16px; color:var(--accent);}
  .fw-main{color:var(--text); font-size:13px; line-height:1.5; padding-right:20px;}
  .fw-body{padding:0 14px 14px; border-top:1px solid var(--line); margin-top:2px; padding-top:12px;}
  .fw-line{display:flex; gap:10px; margin-bottom:8px; font-size:13px;}
  .fw-k{flex-shrink:0; width:64px; color:var(--muted);}
  .fw-line .warn{color:#fbbf24;}
  .fw-prog{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .fw-step{display:flex; gap:8px; align-items:baseline; font-size:13px; line-height:1.5;}
  .fw-badge{flex-shrink:0; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px;}
  .fw-badge.reg{background:#1e3a3a; color:#5eead4;}
  .fw-badge.base{background:#1e3a5f; color:#7dd3fc;}
  .fw-badge.adv{background:#3a1e3a; color:#f0abfc;}
  select.multi-src{}
  .hint{font-size:12px; color:var(--muted); margin-top:4px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">🏋️ 我的健身庫</h1>
  <div class="hbtns">
    <button class="btn ghost sm" id="btnExport">匯出</button>
    <button class="btn ghost sm" id="btnImport">匯入</button>
  </div>
</header>

<main id="app"></main>

<button class="fab" id="fab">＋</button>

<nav class="tabbar">
  <button data-tab="menus" class="active"><span class="ic">📋</span>菜單</button>
  <button data-tab="library"><span class="ic">📚</span>動作庫</button>
  <button data-tab="framework"><span class="ic">📖</span>框架</button>
</nav>

<!-- modal / sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
/* ---------------- 資料層 ---------------- */
const CATS = ["胸","背","腿","臀","肩","手臂","核心","腳踝穩定","重心轉移","爆發跳躍","有氧","伸展","全身"];
// 動作庫分組顯示順序(基礎部位在前,功能性分類在後)
const CAT_ORDER = ["胸","背","腿","臀","肩","核心","手臂","爆發跳躍","腳踝穩定","重心轉移","有氧","伸展","全身"];
const CAT_ICON = {胸:"🫁",背:"🔙",腿:"🦵",臀:"🍑",肩:"💪",核心:"🎯",手臂:"💪",爆發跳躍:"⚡",腳踝穩定:"🦶",重心轉移:"⚖️",有氧:"🏃",伸展:"🧘",全身:"🕺",其他:"📦"};
const EQUIP = ["自體重量","啞鈴","槓鈴","機械","滑輪","壺鈴","彈力帶","其他"];
const SOURCES = ["IG","YouTube","實體課","教練","自己","其他"];
const KEY = "fitness_data_v2";

// 依身體區域的訓練框架(參考用,唯讀)
const FRAMEWORK = [
  {zone:"呼吸 / 核心", main:"仰臥 90/90 呼吸、死蟲、棒式、熊爬、鳥狗", muscle:"橫膈膜、腹橫肌、骨盆底、多裂肌", comp:"胸鎖乳突肌、斜角肌、上斜方肌", regress:"仰躺支撐、膝跪棒式", base:"死蟲、棒式", advance:"動態手腳移動、壺鈴熊爬"},
  {zone:"頸椎", main:"下巴收、頸部控制", muscle:"深層頸屈肌", comp:"胸鎖乳突肌、斜角肌 → 頭前伸", regress:"仰臥下巴收", base:"四足跪頸控", advance:"負重頭頂中立"},
  {zone:"胸椎", main:"貓牛式、開書式、弓步旋轉", muscle:"胸椎伸展肌、旋轉肌群", comp:"腰椎過伸、骨盆旋轉代償", regress:"坐姿胸椎轉動", base:"側臥開書式", advance:"弓步旋轉 + 過頭舉"},
  {zone:"腰椎", main:"死蟲、Bird-dog、Pallof Press", muscle:"腹橫肌、多裂肌", comp:"腰椎伸肌代償(過伸/過屈)", regress:"單腳/單手死蟲", base:"Bird-dog", advance:"功能動作保持中立"},
  {zone:"骨盆 / 髖", main:"橋式、側臥抬腿、弓步、硬舉", muscle:"臀大肌、臀中肌、髂腰肌", comp:"腰椎過伸、腿後肌代償、Trendelenburg", regress:"臀橋、側臥抬腿", base:"弓步、壺鈴硬舉", advance:"單腳硬舉、側向負重走"},
  {zone:"肩胛", main:"肩胛上抬/下壓/前引/後收、牆面滑手", muscle:"前鋸肌、斜方肌下束、菱形肌", comp:"聳肩、翼狀肩胛", regress:"靠牆滑動", base:"四足跪肩胛控制", advance:"TRX 划船、壺鈴肩推"},
  {zone:"肩關節", main:"推舉、拉動、外旋", muscle:"三角肌、旋轉肌群、胸大肌", comp:"聳肩、腰椎過伸", regress:"彈力帶外旋", base:"啞鈴肩推、划船", advance:"引體向上、過頭推舉"},
  {zone:"膝關節", main:"深蹲、分腿蹲、弓步", muscle:"股四頭肌、膕繩肌", comp:"膝內扣、髖代償", regress:"椅子深蹲、半蹲", base:"標準深蹲、分腿蹲", advance:"單腳深蹲、跳躍深蹲"},
  {zone:"踝關節", main:"踝背屈、蹠屈、單腳平衡", muscle:"脛前肌、腓腸肌、比目魚肌", comp:"足內翻/外翻、髖膝代償", regress:"靠牆踝背屈", base:"半蹲踝背屈", advance:"單腳跳、方向變換"},
  {zone:"整合功能", main:"半蹲 → 站立、步態、搬運", muscle:"全身協調、核心控制", comp:"腰椎代償、肩頸過緊", regress:"低負荷轉換、慢走", base:"標準步態、半蹲起立", advance:"負重農夫走、跨步推拉"},
];

let DB = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { exercises: seedExercises(), menus: [] };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ alert("儲存失敗:瀏覽器空間可能已滿"); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function seedExercises(){
  let t=Date.now();
  const mk=(name,cats,eq,src,notes)=>({id:uid(),name,cats,equip:eq,source:src||"",sourceUrl:"",imageData:"",notes:notes||"",createdAt:t--});
  return [
    // 腳踝穩定
    mk("單腳站立",["腳踝穩定"],"自體重量","自己","站立類。單腳站立,訓練本體感覺與平衡。"),
    mk("米字腳",["腳踝穩定"],"自體重量","自己","站立類。單腳為軸心,腳往八個方向點地(米字)。"),
    mk("單腳蹲",["腳踝穩定","腿"],"自體重量","自己","站立類。單腳為軸心做深蹲,不行可扶牆。"),
    mk("彈力帶輔助拉腳踝",["腳踝穩定"],"彈力帶","自己","彈力帶綁在一側,腳踝向反方向拉做對抗,強化腳踝剛性;也可用手拉、使腳踝往下對抗。"),
    mk("單腳跳(米字八方向)",["腳踝穩定","爆發跳躍"],"自體重量","自己","跳躍/動態類。【進階】單腳往八個方向跳(米字)。"),
    // 重心轉移(築健)
    mk("單邊重心轉移",["重心轉移","肩"],"啞鈴","實體課","【築健】開始前雙腳站立注意重心(在腳背前一點點,我習慣往後)。雙手拿球或輕重量,一邊慢慢肩推往上;當有點卡住時,開始把重心往另一邊壓,並持續把肩往上推,肩膀不要有出力不適的感覺。重心不是用腰代償去推,而是用臀外側肌力去推。"),
    mk("髖部重心左右轉移(交叉腳)",["重心轉移","腿","臀"],"啞鈴","實體課","【築健】雙腳站立注意重心。右手拿啞鈴往外甩,往內時把啞鈴提起停住;右腳往左腳後踩,再用右腳往外踩成右弓箭步、左腳伸直;啞鈴手過頭往左側帶。"),
    mk("分腿高跪姿",["重心轉移","臀","核心"],"啞鈴","實體課","【築健】雙手拿單顆啞鈴(右腳高跪)。手往『左下—右上』擺動,腿也跟著:往上時往前、往下時往後。往上會感到前髖被伸展,往下覺得大腿痠;手擺動時身體稍微跟著旋轉。"),
    // 爆發/跳躍
    mk("落地跳接深跳",["爆發跳躍","腿"],"自體重量","自己","從高處落地緩衝後,立刻接一個深跳(depth jump)。"),
    mk("單腳跳箱 (single leg hop by box)",["爆發跳躍","腳踝穩定"],"自體重量","自己","單腳跳上/跳過箱子。"),
    // 胸
    mk("啞鈴臥推",["胸"],"啞鈴","自己"),
    mk("啞鈴上胸推",["胸"],"啞鈴","自己","上斜,練上胸。"),
    mk("槓鈴臥推",["胸"],"槓鈴","自己"),
    mk("槓鈴上胸",["胸"],"槓鈴","自己","上斜槓鈴臥推,練上胸。"),
    mk("滑輪飛鳥",["胸"],"滑輪","自己"),
    mk("雙槓撐體",["胸","手臂"],"自體重量","自己","【進階】身體前傾偏胸,直立偏三頭。"),
    // 背
    mk("引體向上",["背"],"自體重量","自己"),
    mk("滑輪下拉(坐姿)",["背"],"滑輪","自己"),
    mk("滑輪直槓下拉(站姿)",["背"],"滑輪","自己","站姿,直槓下拉。"),
    mk("臉拉",["背","肩"],"滑輪","自己","練後三角與上背。"),
    // 腿
    mk("相撲槓鈴硬舉",["腿","臀"],"槓鈴","自己","相撲站姿,練大腿內側與臀。"),
    mk("相撲啞鈴硬舉",["腿","臀"],"啞鈴","實體課","【築健】啞鈴雙手,重心微往前;屁股重點要往後往下,避免用膝蓋帶動。做的時候會有大腿內側緊緊的,腳板也會在靠近內側的地方有感受。"),
    mk("分腿蹲",["腿","臀"],"自體重量","實體課","【築健】重心稍放前(約腳板中間與小腿交界),後腳往後為墊;屁股往後往下坐,重點往下,身體不要為了平衡而前後壓。左腳多練,會感到後腿與臀交界、大腿內側緊。"),
    mk("單腳硬舉",["腿","臀","腳踝穩定"],"啞鈴","自己","單腿羅馬尼亞硬舉,兼練平衡與腳踝穩定。"),
    mk("壺鈴擺盪",["臀","腿","全身"],"壺鈴","自己","爆發力類。髖鉸鏈發力。"),
    mk("背槓深蹲跳",["腿","爆發跳躍"],"槓鈴","自己","爆發力類。背槓深蹲後爆發跳起(用輕重量)。"),
    // 肩
    mk("滑輪側平舉",["肩"],"滑輪","自己","練中三角。"),

// 把上傳圖片壓縮成最長邊 720px 的 JPEG,避免 localStorage 爆掉
function compressImage(file, cb){
  const reader=new FileReader();
  reader.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const MAX=720; let {width:w,height:h}=im;
      if(w>h && w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
      else if(h>=w && h>MAX){ w=Math.round(w*MAX/h); h=MAX; }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(im,0,0,w,h);
      try{ cb(cv.toDataURL("image/jpeg",0.8)); }
      catch(err){ alert("圖片處理失敗"); }
    };
    im.onerror=()=>alert("無法讀取圖片");
    im.src=reader.result;
  };
  reader.onerror=()=>alert("讀取檔案失敗");
  reader.readAsDataURL(file);
}

  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("active", b.dataset.tab===TAB));

function renderMenus(){
  if(!DB.menus.length){
    return `<div class="empty"><div class="big">📋</div>還沒有菜單<br><span class="small">點右下角 ＋ 建立一個訓練日課表</span></div>`;

  return DB.menus.map(m=>{

      if(!ex) return "";
      const detail = [it.sets&&`${it.sets}組`, it.reps&&`${it.reps}下`, it.weight&&`${it.weight}`].filter(Boolean).join(" × ");
      return `<div class="day-item"><span class="n">${esc(ex.name)}</span><span class="d">${esc(detail)}</span></div>`;

// 一列動作(可點擊 → 開啟詳情)
function exRow(e){
  const thumb = e.imageData ? `<img class="thumb" src="${e.imageData}" alt="">`
    : `<div class="thumb thumb-ph">${CAT_ICON[e.cats[0]]||"🏋️"}</div>`;
  const meta = [e.equip, e.sourceUrl?"🎬 影片":(e.source||""), e.notes?"📝":""].filter(Boolean).join(" · ");
  return `<div class="ex-row" data-viewex="${e.id}">
    ${thumb}
    <div style="flex:1; min-width:0">
      <div class="ex-name">${esc(e.name)}</div>
      ${meta?`<div class="ex-meta">${esc(meta)}</div>`:""}
    </div>
    <span class="chev">›</span>
  </div>`;
}

function renderLibrary(){
  const searchBox = `<input id="libSearch" placeholder="🔍 搜尋動作…" value="${esc(libSearch)}" style="margin-bottom:12px">`;

  // 搜尋模式:跨分類平鋪結果
  if(libSearch.trim()){
    const q=libSearch.trim().toLowerCase();
    const hits=DB.exercises.filter(e=>e.name.toLowerCase().includes(q)||(e.notes||"").toLowerCase().includes(q))
      .sort((a,b)=>b.createdAt-a.createdAt);
    const rows = hits.length ? hits.map(exRow).join("")
      : `<div class="empty"><div class="big">🔍</div>找不到「${esc(libSearch)}」</div>`;
    return `${searchBox}<div class="hint" style="margin:2px 2px 10px">搜尋結果 ${hits.length} 筆</div><div class="card" style="padding:2px 12px">${rows}</div>`;
  }

  // 分組收合模式
  const byCat={};
  DB.exercises.forEach(e=>{ const k=(CAT_ORDER.includes(e.cats[0])?e.cats[0]:"其他"); (byCat[k]=byCat[k]||[]).push(e); });
  const order=[...CAT_ORDER,"其他"];
  const groups = order.filter(c=>byCat[c]&&byCat[c].length).map(c=>{
    const rows = byCat[c].sort((a,b)=>b.createdAt-a.createdAt).map(exRow).join("");
    return `<details class="card grp">
      <summary><span class="grp-ic">${CAT_ICON[c]||"📦"}</span><span class="grp-name">${esc(c)}</span>
        <span class="grp-count">${byCat[c].length}</span></summary>
      <div class="grp-body">${rows}</div>
    </details>`;
  }).join("");

  return `${searchBox}
    <div class="hint" style="margin:2px 2px 12px">共 ${DB.exercises.length} 個動作 · 點分類展開 · 點右下 ＋ 新增</div>
    ${groups || '<div class="empty"><div class="big">📚</div>還沒有動作,點右下 ＋ 新增</div>'}`;
}

function openMenuForm(id){
  const m = id? DB.menus.find(x=>x.id===id) : {name:"",notes:"",items:[]};

  function draw(){
    const rows = items.map((it,i)=>{

      return `<div class="setrow">
        <div class="nm">${esc(ex.name)}</div>

        <button class="btn ghost sm" data-rm="${i}">✕</button>

    }).join("");
    openSheet(`
      <div class="sheethead"><h3>${id?'編輯菜單':'新增菜單'}</h3><div class="spacer"></div>
        <button class="btn ghost sm" id="cxx">取消</button></div>

      <input id="mName" value="${esc(m.name)}" placeholder="例:週一 · 推日(胸肩三頭)">

      <button class="btn" id="addItem" style="width:100%; margin-top:8px">＋ 從動作庫加入</button>
      <div class="row" style="margin-top:18px; gap:8px">
        ${id?`<button class="btn danger sm" id="delMenu">刪除</button>`:""}
        <div class="spacer"></div>
        <button class="btn primary" id="saveMenu" style="padding:11px 20px">儲存菜單</button>
      </div>
    `);
    function sync(){ m.name=$("#mName").value; m.notes=$("#mNotes").value; }
    document.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{ items[inp.dataset.i][inp.dataset.f]=inp.value; });
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ sync(); items.splice(+b.dataset.rm,1); draw(); });
    $("#cxx").onclick=closeSheet;
    $("#addItem").onclick=()=>{ sync(); openPicker(items.map(x=>x.exId), chosen=>{
      chosen.forEach(exId=>{ if(!items.find(x=>x.exId===exId)) items.push({exId,sets:"",reps:""}); }); draw(); }); };
    if(id) $("#delMenu").onclick=()=>{ if(confirm("確定刪除這個菜單?")){ DB.menus=DB.menus.filter(x=>x.id!==id); save(); closeSheet(); render(); } };
    $("#saveMenu").onclick=()=>{
      const name=$("#mName").value.trim(); if(!name){ alert("請輸入菜單名稱"); return; }
      const notes=$("#mNotes").value.trim();
      if(id){ m.name=name; m.notes=notes; m.items=items; }
      else { DB.menus.push({id:uid(), name, notes, items, createdAt:Date.now()}); }
      save(); closeSheet(); render();
    };
  }
  draw();
}

/* ---------------- 動作選擇器 ---------------- */
function openPicker(already, cb){
  let picked = new Set();
  let q="";
  function draw(){
    let list=DB.exercises.slice().sort((a,b)=>b.createdAt-a.createdAt);
    if(q) list=list.filter(e=>e.name.toLowerCase().includes(q.toLowerCase()));
    const rows=list.map(e=>{
      const inMenu=already.includes(e.id);
      return `<label class="pick">
        <input type="checkbox" data-p="${e.id}" ${picked.has(e.id)?'checked':''} ${inMenu?'disabled':''}>
        <div style="flex:1"><div class="ex-name">${esc(e.name)} ${inMenu?'<span class="badge">已在菜單</span>':''}</div>
          <div class="chips">${e.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div></div>
      </label>`;
    }).join("") || '<div class="empty small">找不到動作,先去動作庫新增</div>';
    openSheet(`
      <div class="sheethead"><h3>選擇動作</h3><div class="spacer"></div>
        <button class="btn ghost sm" id="pclose">關閉</button></div>
      <input id="pq" placeholder="🔍 搜尋…" value="${esc(q)}" style="margin-bottom:10px">
      <div>${rows}</div>
      <button class="btn primary" id="pdone" style="width:100%; margin-top:14px; padding:12px">加入所選 (${picked.size})</button>
    `);
    $("#pq").oninput=e=>{ q=e.target.value; draw(); };
    document.querySelectorAll("[data-p]").forEach(cb2=>cb2.onchange=()=>{
      if(cb2.checked) picked.add(cb2.dataset.p); else picked.delete(cb2.dataset.p);
      $("#pdone").textContent=`加入所選 (${picked.size})`;
    });
    $("#pclose").onclick=()=>openMenuBack();
    $("#pdone").onclick=()=>{ cb([...picked]); };
  }
  // 回到菜單表單(取消加入)
  function openMenuBack(){ cb([]); }
  draw();
}

/* ---------------- 匯出 / 匯入 ---------------- */
$("#btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="fitness-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  URL.revokeObjectURL(url);
};
$("#btnImport").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(d.exercises&&d.menus){ if(confirm("匯入將覆蓋現有資料,確定?")){ DB=d; save(); render(); } }
    else alert("檔案格式不正確"); }catch(err){ alert("讀取失敗"); } };
  r.readAsText(f); e.target.value="";
};

/* ---------------- 啟動 ---------------- */
render();
</script>
</body>
</html>
