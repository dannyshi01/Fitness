<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4f4f1">
<title>健身菜單 & 動作庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#f4f4f1; --panel:#ffffff; --panel2:#ebebe6; --line:#e1e0da;
    --ink:#141414; --text:#141414; --muted:#8c8b84; --rule:#141414; --hair:#e1e0da;
    --accent:#e5231b; --accent2:#141414; --good:#1a7f37; --danger:#e5231b; --chip:transparent;
    --font:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;
    --display:"Archivo","Noto Sans TC",sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root{
    --bg:#0d0d0d; --panel:#161615; --panel2:#201f1d; --line:#2a2927;
    --ink:#f0efe9; --text:#f0efe9; --muted:#88867d; --rule:#f0efe9; --hair:#2a2927;
    --accent:#ff5a4d; --accent2:#f0efe9; --good:#4ade80; --danger:#ff5a4d;
  }}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.55;
    padding-bottom:calc(92px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1.5px solid var(--rule);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-family:var(--display); font-size:18px; margin:0; font-weight:800; letter-spacing:-.01em;}
  .hbtns{display:flex; gap:8px;}
  main{padding:16px; max-width:720px; margin:0 auto;}
  h2.sec{font-family:var(--display); font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:20px 0 10px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:3px; font-size:14px;}
  .btn{background:transparent; color:var(--ink); border:1.5px solid var(--rule); padding:7px 13px; font-weight:600;}
  .btn.primary{background:var(--ink); color:var(--bg); border:1.5px solid var(--ink); font-weight:700; letter-spacing:.02em;}
  .btn.ghost{background:transparent; border:1px solid var(--hair); color:var(--muted); padding:7px 11px; font-weight:500;}
  .btn.sm{padding:5px 10px; font-size:13px;}
  .btn.danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  input,select,textarea{
    font-family:inherit; font-size:15px; width:100%; background:var(--panel); color:var(--text);
    border:1.5px solid var(--hair); border-radius:3px; padding:11px 12px; outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--ink);}
  textarea{resize:vertical; min-height:60px;}
  label{display:block; font-family:var(--display); font-size:12px; color:var(--muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
  .card{background:var(--panel); border:1px solid var(--hair); border-radius:4px; padding:14px; margin-bottom:12px;}
  .row{display:flex; gap:8px; align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .spacer{flex:1;}
  .muted{color:var(--muted);}
  .small{font-size:13px;}
  .chip{display:inline-flex; align-items:center; gap:4px; background:transparent; color:var(--ink);
    border:1px solid var(--rule); padding:2px 8px; border-radius:2px; font-size:11px; font-weight:600; white-space:nowrap; letter-spacing:.02em;}
  .chip.eq{background:var(--panel2); border-color:transparent; color:var(--muted);}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tag-chip{display:inline-flex; align-items:center; gap:3px; background:transparent; color:var(--accent);
    padding:2px 8px; border-radius:2px; font-size:11px; font-weight:600; white-space:nowrap; border:1px solid var(--accent);}
  .fchip.tagsel.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .pk-flabel{font-family:var(--display); font-size:11px; color:var(--muted); margin:6px 2px 6px; letter-spacing:.06em; text-transform:uppercase; font-weight:600;}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
    background:var(--bg); border-top:1.5px solid var(--rule);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{flex:1; min-height:60px; background:transparent; color:var(--muted);
    font-family:var(--display); font-size:16px; font-weight:700; letter-spacing:.04em;
    display:flex; align-items:center; justify-content:center; border-radius:0; touch-action:manipulation;}
  .tabbar button.active{color:var(--ink); box-shadow:inset 0 3px 0 var(--ink);}
  /* login / banner */
  .login{position:fixed; inset:0; z-index:60; background:var(--bg); display:none; align-items:center; justify-content:center; padding:24px;}
  .login.open{display:flex;}
  .login-box{width:100%; max-width:340px;}
  .login-box h2{font-family:var(--display); font-size:26px; font-weight:900; margin:0 0 6px; letter-spacing:-.02em;}
  .login-box p{color:var(--muted); font-size:13px; margin:0 0 18px;}
  .login-err{color:var(--accent); font-size:13px; min-height:18px; margin-top:10px;}
  .banner{background:var(--ink); color:var(--bg); font-size:12px; font-weight:600; padding:6px 16px; text-align:center; letter-spacing:.03em;}
  .banner[hidden]{display:none;}
  .empty{text-align:center; color:var(--muted); padding:44px 20px;}
  .empty .big{font-size:38px; margin-bottom:10px; filter:grayscale(1); opacity:.55;}
  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:none; align-items:flex-end; justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:var(--bg); width:100%; max-width:720px; max-height:92vh; overflow:auto;
    border-radius:0; border-top:2px solid var(--rule); padding:18px 16px calc(24px + env(safe-area-inset-bottom));}
  .sheet h3{font-family:var(--display); margin:0 0 4px; font-size:19px; font-weight:800;}
  .sheethead{display:flex; align-items:center; margin-bottom:10px;}
  .filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; -webkit-overflow-scrolling:touch;}
  .filters::-webkit-scrollbar{display:none;}
  .fchip{white-space:nowrap; background:transparent; border:1px solid var(--hair); color:var(--muted);
    padding:6px 12px; border-radius:2px; font-size:13px; font-weight:600;}
  .fchip.on{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .ex-item{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--hair);}
  .ex-item:last-child{border-bottom:none;}
  .ex-name{font-weight:600;}
  .thumb{width:46px; height:46px; border-radius:2px; object-fit:cover; flex-shrink:0; background:var(--panel2); filter:grayscale(.2);}
  .thumb-ph{display:flex; align-items:center; justify-content:center; font-size:20px; filter:grayscale(1); opacity:.75;}
  /* library groups */
  details.grp{padding:0; position:relative; margin-bottom:14px; border-top:2px solid var(--rule);}
  details.grp summary{list-style:none; cursor:pointer; padding:12px 2px; display:flex; align-items:center; gap:9px;}
  details.grp summary::-webkit-details-marker{display:none;}
  details.grp summary::after{content:"+"; font-family:var(--display); color:var(--muted); margin-left:2px; font-size:18px; font-weight:700;}
  details.grp[open] summary::after{content:"\2013";}
  .grp-ic{font-size:16px; filter:grayscale(1); opacity:.8;}
  .grp-name{font-family:var(--display); font-weight:800; font-size:16px; letter-spacing:.01em;}
  .grp-count{background:transparent; color:var(--accent); font-family:var(--display); font-size:13px; font-weight:800; padding:0; margin-left:auto; font-variant-numeric:tabular-nums;}
  .grp-body{padding:0 2px 4px;}
  .ex-row{display:flex; align-items:center; gap:11px; padding:11px 0; border-top:1px solid var(--hair); cursor:pointer;}
  .ex-row:last-child{}
  .ex-row:active{opacity:.55;}
  .ex-meta{color:var(--muted); font-size:11px; margin-top:3px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chev{color:var(--muted); font-size:18px; flex-shrink:0;}
  /* exercise detail view */
  .v-img{width:100%; max-height:280px; object-fit:cover; border-radius:3px; display:block;}
  .v-video{display:block; text-align:center; text-decoration:none;}
  .v-notes{background:var(--panel); border:1px solid var(--hair); border-left:3px solid var(--accent);
    border-radius:3px; padding:13px 15px; margin-top:12px; line-height:1.75; font-size:14px;}
  .v-notes-h{font-family:var(--display); font-size:11px; color:var(--muted); margin-bottom:7px; letter-spacing:.06em; text-transform:uppercase; font-weight:600;}
  .imgprev{width:100%; max-height:200px; object-fit:cover; border-radius:3px; margin-top:8px; display:block;}
  .imgrow{display:flex; gap:8px; align-items:center; margin-top:6px;}
  .link{color:var(--accent); text-decoration:none; font-weight:600;}
  .setrow{display:grid; grid-template-columns:1fr 64px 64px auto; gap:8px; align-items:center; margin-bottom:8px;}
  .setrow input{padding:8px; text-align:center;}
  .setrow .nm{text-align:left; font-weight:600;}
  .pick{display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--hair);}
  .pick input[type=checkbox]{width:20px; height:20px; accent-color:var(--accent);}
  .fab{position:fixed; right:16px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:25;
    width:54px; height:54px; border-radius:50%; background:var(--ink); color:var(--bg); font-size:26px;
    box-shadow:0 4px 16px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; font-weight:300;}
  .tagline{color:var(--muted); font-size:13px; margin-top:3px;}
  .divide{height:1px; background:var(--hair); margin:14px 0;}
  .badge{font-family:var(--display); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
  .day-item{display:flex; align-items:baseline; gap:8px; padding:7px 0; border-bottom:1px solid var(--hair);}
  .day-item:last-child{border-bottom:none;}
  .day-item .n{font-weight:600;}
  .day-item .d{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums;}
  /* framework */
  .fw-intro{color:var(--muted); font-size:13px; line-height:1.7; margin-bottom:16px;
    border-left:3px solid var(--accent); padding:4px 0 4px 12px;}
  details.fw{padding:0; overflow:hidden; position:relative; border-top:2px solid var(--rule);}
  details.fw summary{list-style:none; cursor:pointer; padding:13px 2px; display:flex; flex-direction:column; gap:4px;}
  details.fw summary::-webkit-details-marker{display:none;}
  details.fw summary::after{content:"+"; font-family:var(--display); position:absolute; right:4px; top:12px; color:var(--muted); font-size:18px; font-weight:700;}
  details.fw[open] summary::after{content:"\2013";}
  .fw-zone{font-family:var(--display); font-weight:800; font-size:16px; color:var(--ink);}
  .fw-main{color:var(--muted); font-size:13px; line-height:1.5; padding-right:20px;}
  .fw-body{padding:0 2px 16px; margin-top:8px;}
  .fw-line{display:flex; gap:10px; margin-bottom:8px; font-size:13px;}
  .fw-k{font-family:var(--display); flex-shrink:0; width:64px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .fw-line .warn{color:var(--accent);}
  .fw-prog{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .fw-step{display:flex; gap:8px; align-items:baseline; font-size:13px; line-height:1.5;}
  .fw-badge{font-family:var(--display); flex-shrink:0; font-size:10px; font-weight:700; padding:2px 7px; border-radius:2px; text-transform:uppercase; letter-spacing:.04em; border:1px solid var(--hair);}
  .fw-badge.reg{background:transparent; color:var(--muted); border-color:var(--hair);}
  .fw-badge.base{background:transparent; color:var(--ink); border-color:var(--rule);}
  .fw-badge.adv{background:var(--accent); color:#fff; border-color:var(--accent);}
  .hint{font-size:12px; color:var(--muted); margin-top:4px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">我的健身庫</h1>
  <div class="hbtns">
    <button class="btn ghost sm" id="btnExport">匯出</button>
    <button class="btn ghost sm" id="btnImport">匯入</button>
    <button class="btn ghost sm" id="btnLogout">登出</button>
  </div>
</header>
<div class="banner" id="banner" hidden></div>

<main id="app"></main>

<button class="fab" id="fab">＋</button>

<nav class="tabbar">
  <button data-tab="library" class="active">動作庫</button>
  <button data-tab="menus">菜單</button>
  <button data-tab="framework">框架</button>
</nav>

<!-- modal / sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<!-- 登入 -->
<div class="login" id="login">
  <form class="login-box" id="loginForm">
    <h2>健身菜單庫</h2>
    <p>登入後才能看到你的動作與菜單。</p>
    <label>Email</label>
    <input id="lgEmail" type="email" autocomplete="username" required>
    <label>密碼</label>
    <input id="lgPass" type="password" autocomplete="current-password" required>
    <div class="login-err" id="lgErr"></div>
    <button class="btn primary" id="lgBtn" type="submit" style="width:100%; margin-top:14px; padding:13px">登入</button>
  </form>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
/* ---------------- 資料層 ---------------- */
// 肌群 / 部位(動作庫的主分類,用來分組)
const CATS = ["胸","背","肩","手臂","腿","臀","核心","全身"];
const CAT_ORDER = ["胸","背","肩","手臂","腿","臀","核心","全身"];
const CAT_ICON = {胸:"🫁",背:"🔙",肩:"🦾",手臂:"💪",腿:"🦵",臀:"🍑",核心:"🎯",全身:"🕺",其他:"📦"};
// 特色標籤(跨肌群的特性,可貼在不同動作上)
const TAGS = ["爆發跳躍","腳踝穩定","重心轉移","活動度","矯正穩定","進階"];
const TAG_ICON = {爆發跳躍:"⚡",腳踝穩定:"🦶",重心轉移:"⚖️",活動度:"🧘",矯正穩定:"🩹",進階:"🔥"};
const EQUIP = ["自體重量","啞鈴","槓鈴","機械","滑輪","壺鈴","彈力帶","其他"];
const SOURCES = ["IG","YouTube","實體課","教練","自己","其他"];
// 依身體區域的訓練框架(參考用,唯讀)
const FRAMEWORK = [
  {zone:"呼吸 / 核心", main:"仰臥 90/90 呼吸、死蟲、棒式、熊爬、鳥狗", muscle:"橫膈膜、腹橫肌、骨盆底、多裂肌", comp:"胸鎖乳突肌、斜角肌、上斜方肌", regress:"仰躺支撐、膝跪棒式", base:"死蟲、棒式", advance:"動態手腳移動、壺鈴熊爬"},
  {zone:"頸椎", main:"下巴收、頸部控制", muscle:"深層頸屈肌", comp:"胸鎖乳突肌、斜角肌 → 頭前伸", regress:"仰臥下巴收", base:"四足跪頸控", advance:"負重頭頂中立"},
  {zone:"胸椎", main:"貓牛式、開書式、弓步旋轉", muscle:"胸椎伸展肌、旋轉肌群", comp:"腰椎過伸、骨盆旋轉代償", regress:"坐姿胸椎轉動", base:"側臥開書式", advance:"弓步旋轉 + 過頭舉"},
  {zone:"腰椎", main:"死蟲、Bird-dog、Pallof Press", muscle:"腹橫肌、多裂肌", comp:"腰椎伸肌代償(過伸/過屈)", regress:"單腳/單手死蟲", base:"Bird-dog", advance:"功能動作保持中立"},
  {zone:"骨盆 / 髖", main:"橋式、側臥抬腿、弓步、硬舉", muscle:"臀大肌、臀中肌、髂腰肌", comp:"腰椎過伸、腿後肌代償、Trendelenburg", regress:"臀橋、側臥抬腿", base:"弓步、壺鈴硬舉", advance:"單腳硬舉、側向負重走"},
  {zone:"肩胛", main:"肩胛上抬/下壓/前引/後收、牆面滑手", muscle:"前鋸肌、斜方肌下束、菱形肌", comp:"聳肩、翼狀肩胛", regress:"靠牆滑動", base:"四足跪肩胛控制", advance:"TRX 划船、壺鈴肩推"},
  {zone:"肩關節", main:"推舉、拉動、外旋", muscle:"三角肌、旋轉肌群、胸大肌", comp:"聳肩、腰椎過伸", regress:"彈力帶外旋", base:"啞鈴肩推、划船", advance:"引體向上、過頭推舉"},
  {zone:"膝關節", main:"深蹲、分腿蹲、弓步", muscle:"股四頭肌、膕繩肌", comp:"膝內扣、髖代償", regress:"椅子深蹲、半蹲", base:"標準深蹲、分腿蹲", advance:"單腳深蹲、跳躍深蹲"},
  {zone:"踝關節", main:"踝背屈、蹠屈、單腳平衡", muscle:"脛前肌、腓腸肌、比目魚肌", comp:"足內翻/外翻、髖膝代償", regress:"靠牆踝背屈", base:"半蹲踝背屈", advance:"單腳跳、方向變換"},
  {zone:"整合功能", main:"半蹲 → 站立、步態、搬運", muscle:"全身協調、核心控制", comp:"腰椎代償、肩頸過緊", regress:"低負荷轉換、慢走", base:"標準步態、半蹲起立", advance:"負重農夫走、跨步推拉"},
];

/* ---------------- Supabase 雲端資料層 ---------------- */
// URL 與 publishable key 是給瀏覽器用的公開值;資料安全由資料庫的 RLS 權限規則 + 登入把關
const SUPA_URL = "https://zerymfrjnowwjdaqectk.supabase.co";
const SUPA_KEY = "sb_publishable_kqiAz5Cp_Wk3ZA3VFFttCA_VKQLc1XR";
const BUCKET = "exercise-images";
const CACHE_KEY = "fitness_cache_v1";                                   // 離線時顯示用的上次資料
const LEGACY_KEYS = ["fitness_data_v3","fitness_data_v2","fitness_data_v1"]; // 舊版存在瀏覽器的資料,首次登入時搬上雲
let sb = null;
let USER = null;
let DB = { exercises: [], menus: [] };

// 一定要用 uuid:Postgres 的 id 欄位是 uuid 型別
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
const errMsg = err => (err && err.message) ? err.message : String(err);

const rowToEx = r => ({ id:r.id, name:r.name, cats:r.cats||[], tags:r.tags||[], equip:r.equip||"", source:r.source||"",
  sourceUrl:r.source_url||"", videoUrl:r.video_url||"", imagePath:r.image_path||"", imageData:"", notes:r.notes||"",
  createdAt:Date.parse(r.created_at)||Date.now() });
const exToRow = e => ({ id:e.id, name:e.name, cats:e.cats||[], tags:e.tags||[], equip:e.equip||"", source:e.source||"",
  source_url:e.sourceUrl||"", video_url:e.videoUrl||"", image_path:e.imagePath||"", notes:e.notes||"",
  created_at:new Date(e.createdAt||Date.now()).toISOString(), updated_at:new Date().toISOString() });

function writeCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({uid:USER.id, db:DB})); }catch(e){} }
function readCache(){ try{ const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); if(c&&USER&&c.uid===USER.id) return c.db; }catch(e){} return null; }

// 私有 bucket 的圖片要用「有時效的簽名網址」顯示
async function attachImageUrls(list){
  const withImg=list.filter(e=>e.imagePath);
  if(!withImg.length) return;
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrls(withImg.map(e=>e.imagePath),3600);
  if(error||!data) return;
  data.forEach(d=>{ const e=withImg.find(x=>x.imagePath===d.path); if(e&&d.signedUrl) e.imageData=d.signedUrl; });
}

async function loadAll(){
  const [ex,me,mi]=await Promise.all([
    sb.from("exercises").select("*").order("created_at",{ascending:false}),
    sb.from("menus").select("*").order("created_at",{ascending:true}),
    sb.from("menu_items").select("*").order("position",{ascending:true}),
  ]);
  for(const r of [ex,me,mi]) if(r.error) throw r.error;
  const exercises=ex.data.map(rowToEx);
  const menus=me.data.map(r=>({ id:r.id, name:r.name, notes:r.notes||"", createdAt:Date.parse(r.created_at)||Date.now(), items:[] }));
  const byId=Object.fromEntries(menus.map(m=>[m.id,m]));
  mi.data.forEach(r=>{ const m=byId[r.menu_id]; if(m) m.items.push({ id:r.id, exId:r.exercise_id, sets:r.sets||"", reps:r.reps||"" }); });
  await attachImageUrls(exercises);
  return { exercises, menus };
}

async function uploadImage(exId, dataUrl){
  const blob=await (await fetch(dataUrl)).blob();
  const path=`${USER.id}/${exId}-${Date.now()}.jpg`;
  const up=await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type||"image/jpeg", upsert:true });
  if(up.error) throw up.error;
  return path;
}

// img:表單裡目前的圖片。"data:..." = 新選的;空字串 = 移除;其他(簽名網址)= 沒改
async function persistExercise(ex, img){
  const store=sb.storage.from(BUCKET);
  if(img && img.startsWith("data:")){
    const old=ex.imagePath;
    ex.imagePath=await uploadImage(ex.id, img);
    const s=await store.createSignedUrl(ex.imagePath,3600);
    ex.imageData=(s.data&&s.data.signedUrl)||img;
    if(old) await store.remove([old]);
  }else if(!img && ex.imagePath){
    await store.remove([ex.imagePath]); ex.imagePath=""; ex.imageData="";
  }
  const {error}=await sb.from("exercises").upsert(exToRow(ex));
  if(error) throw error;
}
async function removeExercise(ex){
  const {error}=await sb.from("exercises").delete().eq("id",ex.id);   // menu_items 會連帶刪除
  if(error) throw error;
  if(ex.imagePath) await sb.storage.from(BUCKET).remove([ex.imagePath]);
}
async function persistMenu(m){
  const a=await sb.from("menus").upsert({ id:m.id, name:m.name, notes:m.notes||"",
    created_at:new Date(m.createdAt||Date.now()).toISOString(), updated_at:new Date().toISOString() });
  if(a.error) throw a.error;
  const rows=m.items.map((it,i)=>({ id:it.id, menu_id:m.id, exercise_id:it.exId, sets:it.sets||"", reps:it.reps||"", position:i }));
  if(rows.length){ const b=await sb.from("menu_items").upsert(rows); if(b.error) throw b.error; }
  let del=sb.from("menu_items").delete().eq("menu_id",m.id);            // 刪掉已被移除的項目
  if(rows.length) del=del.not("id","in",`(${rows.map(r=>r.id).join(",")})`);
  const c=await del; if(c.error) throw c.error;
}
async function removeMenu(id){
  const {error}=await sb.from("menus").delete().eq("id",id);
  if(error) throw error;
}

// 舊版 / 匯入檔 → 新結構(肌群 vs 標籤拆開)
function normalizeLegacy(d){
  const exercises=(d.exercises||[]).map(e=>{
    const cats=[], tags=[...(e.tags||[])];
    (e.cats||[]).forEach(c=>{ if(CATS.includes(c)) cats.push(c); else if(TAGS.includes(c)) tags.push(c); else if(c==="伸展") tags.push("活動度"); });
    return { ...e, cats: cats.length?[...new Set(cats)]:["全身"], tags:[...new Set(tags)] };
  });
  return { exercises, menus: d.menus||[] };
}

// 把一包 {exercises, menus} 寫進雲端。一律配發新 uuid,舊 id 只用來對應菜單裡的動作
async function bulkInsert(payload){
  const exMap={}, rows=[];
  for(const e of payload.exercises){
    const ex={ id:uid(), name:e.name, cats:e.cats||[], tags:e.tags||[], equip:e.equip||"", source:e.source||"",
      sourceUrl:e.sourceUrl||"", videoUrl:e.videoUrl||"", imagePath:"", notes:e.notes||"", createdAt:e.createdAt||Date.now() };
    exMap[e.id]=ex.id;
    if(e.imageData && e.imageData.startsWith("data:")) ex.imagePath=await uploadImage(ex.id, e.imageData);
    rows.push(exToRow(ex));
  }
  if(rows.length){ const r=await sb.from("exercises").insert(rows); if(r.error) throw r.error; }
  const menuRows=[], itemRows=[];
  (payload.menus||[]).forEach(m=>{
    const id=uid();
    menuRows.push({ id, name:m.name, notes:m.notes||"", created_at:new Date(m.createdAt||Date.now()).toISOString() });
    (m.items||[]).forEach((it,i)=>{ const exId=exMap[it.exId];
      if(exId) itemRows.push({ id:uid(), menu_id:id, exercise_id:exId, sets:it.sets||"", reps:it.reps||"", position:i }); });
  });
  if(menuRows.length){ const r=await sb.from("menus").insert(menuRows); if(r.error) throw r.error; }
  if(itemRows.length){ const r=await sb.from("menu_items").insert(itemRows); if(r.error) throw r.error; }
}

// 第一次登入且雲端是空的:優先把這個瀏覽器裡舊版的資料搬上去;沒有就放預設動作庫
async function firstTimeSetup(){
  let payload=null;
  for(const k of LEGACY_KEYS){
    try{ const d=JSON.parse(localStorage.getItem(k)||"null");
      if(d && Array.isArray(d.exercises) && d.exercises.length){ payload=normalizeLegacy(d); break; } }catch(e){}
  }
  if(!payload) payload={ exercises:seedExercises(), menus:[] };
  await bulkInsert(payload);
}

// 把上傳圖片壓縮成最長邊 720px 的 JPEG,避免 localStorage 爆掉
function compressImage(file, cb){
  const reader=new FileReader();
  reader.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const MAX=720; let {width:w,height:h}=im;
      if(w>h && w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
      else if(h>=w && h>MAX){ w=Math.round(w*MAX/h); h=MAX; }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(im,0,0,w,h);
      try{ cb(cv.toDataURL("image/jpeg",0.8)); }
      catch(err){ alert("圖片處理失敗"); }
    };
    im.onerror=()=>alert("無法讀取圖片");
    im.src=reader.result;
  };
  reader.onerror=()=>alert("讀取檔案失敗");
  reader.readAsDataURL(file);
}

  return `${searchBox}
    <div class="hint" style="margin:2px 2px 12px">共 ${DB.exercises.length} 個動作 · 點分類展開 · 點右下 ＋ 新增</div>
    ${groups || '<div class="empty">還沒有動作,點右下 ＋ 新增</div>'}`;
}

/* ---------------- 事件綁定 ---------------- */
function wire(){
  const s=$("#libSearch"); if(s){ s.oninput=e=>{ libSearch=e.target.value; const pos=s.selectionStart;
    render(); const ns=$("#libSearch"); if(ns){ns.focus(); ns.setSelectionRange(pos,pos);} }; }
  document.querySelectorAll("[data-viewex]").forEach(b=>b.onclick=()=>openExerciseView(b.dataset.viewex));
  document.querySelectorAll("[data-editmenu]").forEach(b=>b.onclick=()=>openMenuForm(b.dataset.editmenu));
}

/* ---------------- Sheet 控制 ---------------- */
function openSheet(html){ $("#sheet").innerHTML=html; $("#overlay").classList.add("open"); }
function closeSheet(){ $("#overlay").classList.remove("open"); }
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeSheet(); });

/* ---------------- 動作詳情(檢視) ---------------- */
function openExerciseView(id){
  const e=exById(id); if(!e) return;
  const cats=e.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join("");
  const tags=(e.tags||[]).map(t=>`<span class="tag-chip">${esc(t)}</span>`).join("");
  const eq=e.equip?`<span class="chip eq">${esc(e.equip)}</span>`:"";
  const img=e.imageData?`<img class="v-img" src="${e.imageData}" alt="">`:"";
  const video=e.sourceUrl
    ? `<a class="btn primary v-video" href="${esc(e.sourceUrl)}" target="_blank" rel="noopener">🎬 開啟${e.source==="YouTube"?" YouTube":e.source==="IG"?" IG":""}影片 / 來源</a>`
    : (e.source?`<div class="v-src muted small">來源:${esc(e.source)}</div>`:"");
  openSheet(`
    <div class="sheethead"><h3>${esc(e.name)}</h3><div class="spacer"></div>
      <button class="btn ghost sm" id="cxx">關閉</button></div>
    <div class="chips" style="margin:2px 0 12px">${cats}${eq}${tags}</div>
    ${img}
    ${video?`<div style="margin:${img?'12px':'0'} 0 4px">${video}</div>`:""}
    ${e.notes?`<div class="v-notes"><div class="v-notes-h">📝 動作說明 / 教練提示</div>${esc(e.notes).replace(/\n/g,"<br>")}</div>`:'<div class="muted small" style="margin-top:10px">尚無說明,點下方「編輯」補上重點或影片連結。</div>'}
    <div class="row" style="margin-top:20px; gap:8px">
      <button class="btn danger sm" id="vDel">刪除</button>
      <div class="spacer"></div>
      <button class="btn" id="vEdit" style="padding:9px 18px">✏️ 編輯</button>
    </div>
  `);
  $("#cxx").onclick=closeSheet;
  $("#vEdit").onclick=()=>openExerciseForm(id);
  $("#vDel").onclick=()=>deleteExercise(id);
}

async function deleteExercise(id){
  const e=exById(id); if(!e) return;
  if(!confirm("確定刪除「"+e.name+"」?")) return;
  try{
    await removeExercise(e);
    DB.exercises=DB.exercises.filter(x=>x.id!==id);
    DB.menus.forEach(m=>m.items=m.items.filter(it=>it.exId!==id));
    writeCache(); closeSheet(); render();
  }catch(err){ alert("刪除失敗:"+errMsg(err)); }
}

/* ---------------- 動作表單 ---------------- */
function openExerciseForm(id){
  const e = id? exById(id) : {name:"",cats:[],tags:[],equip:"",source:"",sourceUrl:"",notes:""};
  const eTags = e.tags||[];
  const catBtns = CATS.map(c=>`<button type="button" class="fchip ${e.cats.includes(c)?'on':''}" data-tc="${c}">${c}</button>`).join("");
  const tagBtns = TAGS.map(t=>`<button type="button" class="fchip tagsel ${eTags.includes(t)?'on':''}" data-tg="${t}">${t}</button>`).join("");
  const eqOpts = ['<option value="">器材(選填)</option>',...EQUIP.map(x=>`<option ${e.equip===x?'selected':''}>${x}</option>`)].join("");
  const srcOpts = ['<option value="">來源(選填)</option>',...SOURCES.map(x=>`<option ${e.source===x?'selected':''}>${x}</option>`)].join("");
  openSheet(`
    <div class="sheethead"><h3>${id?'編輯動作':'新增動作'}</h3><div class="spacer"></div>
      <button class="btn ghost sm" id="cxx">取消</button></div>
    <label>動作名稱 *</label>
    <input id="fName" value="${esc(e.name)}" placeholder="例:保加利亞分腿蹲" autofocus>
    <label>部位分類(肌群)<span class="muted">(可多選,先選一個也行)</span></label>
    <div class="filters" id="catPick" style="flex-wrap:wrap; overflow:visible">${catBtns}</div>
    <label>特色標籤 <span class="muted">(選填,可多選)</span></label>
    <div class="filters" id="tagPick" style="flex-wrap:wrap; overflow:visible">${tagBtns}</div>
    <div class="row" style="gap:8px">
      <div style="flex:1"><label>器材</label><select id="fEquip">${eqOpts}</select></div>
      <div style="flex:1"><label>來源</label><select id="fSource">${srcOpts}</select></div>
    </div>
    <label>來源連結 <span class="muted">(IG / YouTube 網址,選填)</span></label>
    <input id="fUrl" value="${esc(e.sourceUrl)}" placeholder="https://www.instagram.com/…" inputmode="url">
    <label>筆記 / 教練提示</label>
    <textarea id="fNotes" placeholder="例:膝蓋不超過腳尖、核心收緊…">${esc(e.notes)}</textarea>
    <label>動作示範圖片 <span class="muted">(選填,可拍照或截圖)</span></label>
    <div class="imgrow">
      <button type="button" class="btn sm" id="pickImg">📷 選擇圖片</button>
      <button type="button" class="btn ghost sm" id="clrImg" style="${e.imageData?'':'display:none'}">移除</button>
    </div>
    <img id="imgPrev" class="imgprev" src="${e.imageData||''}" style="${e.imageData?'':'display:none'}">
    <input type="file" id="fImgFile" accept="image/*" style="display:none">
    <div class="row" style="margin-top:18px; gap:8px">
      ${id?`<button class="btn danger sm" id="delEx">刪除</button>`:""}
      <div class="spacer"></div>
      <button class="btn primary" id="saveEx" style="padding:11px 20px">儲存</button>
    </div>
  `);
  let sel = [...e.cats];
  let selTags = [...eTags];
  let img = e.imageData || "";
  document.querySelectorAll("#catPick [data-tc]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.tc; if(sel.includes(c)) sel=sel.filter(x=>x!==c); else sel.push(c);
    b.classList.toggle("on");
  });
  document.querySelectorAll("#tagPick [data-tg]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.tg; if(selTags.includes(t)) selTags=selTags.filter(x=>x!==t); else selTags.push(t);
    b.classList.toggle("on");
  });
  $("#pickImg").onclick=()=>$("#fImgFile").click();
  $("#clrImg").onclick=()=>{ img=""; $("#imgPrev").style.display="none"; $("#clrImg").style.display="none"; };
  $("#fImgFile").onchange=ev=>{
    const f=ev.target.files[0]; if(!f) return;
    compressImage(f, dataUrl=>{ img=dataUrl;
      $("#imgPrev").src=dataUrl; $("#imgPrev").style.display="block"; $("#clrImg").style.display="inline-flex"; });
    ev.target.value="";
  };
  $("#cxx").onclick=closeSheet;
  if(id) $("#delEx").onclick=()=>deleteExercise(id);
  $("#saveEx").onclick=async ()=>{
    const name=$("#fName").value.trim();
    if(!name){ alert("請輸入動作名稱"); return; }
    const btn=$("#saveEx"); btn.disabled=true; btn.textContent="儲存中…";
    const base = id ? {...exById(id)} : { id:uid(), createdAt:Date.now(), imagePath:"", imageData:"", videoUrl:"" };
    const ex = { ...base, name, cats:sel, tags:selTags, equip:$("#fEquip").value, source:$("#fSource").value,
      sourceUrl:$("#fUrl").value.trim(), notes:$("#fNotes").value.trim() };
    try{
      await persistExercise(ex, img);
      if(id) Object.assign(exById(id), ex); else DB.exercises.push(ex);
      writeCache(); closeSheet(); render();
    }catch(err){
      alert("儲存失敗:"+errMsg(err));
      btn.disabled=false; btn.textContent="儲存";
    }
  };
}

/* ---------------- 菜單表單 ---------------- */
function openMenuForm(id){
  const orig = id ? DB.menus.find(x=>x.id===id) : null;
  const m = orig ? {...orig} : {name:"",notes:"",items:[]};   // 複製一份編輯,取消就不會動到原資料
  let items = JSON.parse(JSON.stringify(m.items)).map(it=>({ ...it, id: it.id || uid() }));
  function draw(){
    const rows = items.map((it,i)=>{
      const ex=exById(it.exId); if(!ex) return "";
      return `<div class="setrow">
        <div class="nm">${esc(ex.name)}</div>
        <input data-f="sets" data-i="${i}" value="${esc(it.sets||"")}" placeholder="組" inputmode="numeric">
        <input data-f="reps" data-i="${i}" value="${esc(it.reps||"")}" placeholder="次" inputmode="numeric">
        <button class="btn ghost sm" data-rm="${i}">✕</button>
      </div>`;
    }).join("");
    openSheet(`
      <div class="sheethead"><h3>${id?'編輯菜單':'新增菜單'}</h3><div class="spacer"></div>
        <button class="btn ghost sm" id="cxx">取消</button></div>
      <label>菜單名稱 *</label>
      <input id="mName" value="${esc(m.name)}" placeholder="例:週一 · 推日(胸肩三頭)">
      <label>備註</label>
      <input id="mNotes" value="${esc(m.notes)}" placeholder="例:每組間休息 90 秒">
      <label style="margin-top:16px">動作清單 <span class="muted">(填組數 × 次數)</span></label>
      <div>${rows||'<div class="muted small" style="padding:6px 0">還沒加入動作</div>'}</div>
      <button class="btn" id="addItem" style="width:100%; margin-top:8px">＋ 從動作庫加入</button>
      <div class="row" style="margin-top:18px; gap:8px">
        ${id?`<button class="btn danger sm" id="delMenu">刪除</button>`:""}
        <div class="spacer"></div>
        <button class="btn primary" id="saveMenu" style="padding:11px 20px">儲存菜單</button>
      </div>
    `);
    function sync(){ m.name=$("#mName").value; m.notes=$("#mNotes").value; }
    document.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{ items[inp.dataset.i][inp.dataset.f]=inp.value; });
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ sync(); items.splice(+b.dataset.rm,1); draw(); });
    $("#cxx").onclick=closeSheet;
    $("#addItem").onclick=()=>{ sync(); openPicker(items.map(x=>x.exId), chosen=>{
      chosen.forEach(exId=>{ if(!items.find(x=>x.exId===exId)) items.push({id:uid(),exId,sets:"",reps:""}); }); draw(); }); };
    if(id) $("#delMenu").onclick=async ()=>{
      if(!confirm("確定刪除這個菜單?")) return;
      try{ await removeMenu(id); DB.menus=DB.menus.filter(x=>x.id!==id); writeCache(); closeSheet(); render(); }
      catch(err){ alert("刪除失敗:"+errMsg(err)); }
    };
    $("#saveMenu").onclick=async ()=>{
      const name=$("#mName").value.trim(); if(!name){ alert("請輸入菜單名稱"); return; }
      const notes=$("#mNotes").value.trim();
      const btn=$("#saveMenu"); btn.disabled=true; btn.textContent="儲存中…";
      const menu = orig ? { ...orig, name, notes, items } : { id:uid(), name, notes, items, createdAt:Date.now() };
      try{
        await persistMenu(menu);
        if(orig) Object.assign(orig, menu); else DB.menus.push(menu);
        writeCache(); closeSheet(); render();
      }catch(err){
        alert("儲存失敗:"+errMsg(err));
        btn.disabled=false; btn.textContent="儲存菜單";
      }
    };
  }
  draw();
}

/* ---------------- 動作選擇器 ---------------- */
function openPicker(already, cb){
  let picked = new Set();
  let q="", fCat="", fTag="";
  function draw(){
    let list=DB.exercises.slice().sort((a,b)=>b.createdAt-a.createdAt);
    if(fCat) list=list.filter(e=>e.cats.includes(fCat));
    if(fTag) list=list.filter(e=>(e.tags||[]).includes(fTag));
    if(q) list=list.filter(e=>e.name.toLowerCase().includes(q.toLowerCase())||(e.notes||"").toLowerCase().includes(q.toLowerCase()));

    // 只顯示實際有動作的肌群 / 標籤
    const usedCats=CATS.filter(c=>DB.exercises.some(e=>e.cats.includes(c)));
    const usedTags=TAGS.filter(t=>DB.exercises.some(e=>(e.tags||[]).includes(t)));
    const catChips=[`<button class="fchip ${!fCat?'on':''}" data-fc="">全部部位</button>`,
      ...usedCats.map(c=>`<button class="fchip ${fCat===c?'on':''}" data-fc="${c}">${c}</button>`)].join("");
    const tagChips=[`<button class="fchip ${!fTag?'on':''}" data-ft="">全部標籤</button>`,
      ...usedTags.map(t=>`<button class="fchip tagsel ${fTag===t?'on':''}" data-ft="${t}">${t}</button>`)].join("");

    const rows=list.map(e=>{
      const inMenu=already.includes(e.id);
      const tags=(e.tags||[]).map(t=>`<span class="tag-chip">${esc(t)}</span>`).join("");
      return `<label class="pick">
        <input type="checkbox" data-p="${e.id}" ${picked.has(e.id)?'checked':''} ${inMenu?'disabled':''}>
        <div style="flex:1; min-width:0"><div class="ex-name">${esc(e.name)} ${inMenu?'<span class="badge">已在菜單</span>':''}</div>
          <div class="chips">${e.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${tags}</div></div>
      </label>`;
    }).join("") || '<div class="empty small">沒有符合的動作,換個篩選或先去動作庫新增</div>';

    openSheet(`
      <div class="sheethead"><h3>選擇動作</h3><div class="spacer"></div>
        <button class="btn ghost sm" id="pclose">關閉</button></div>
      <input id="pq" placeholder="搜尋動作名稱 / 筆記…" value="${esc(q)}" style="margin-bottom:10px">
      <div class="pk-flabel">部位</div>
      <div class="filters">${catChips}</div>
      <div class="pk-flabel">特色標籤</div>
      <div class="filters">${tagChips}</div>
      <div class="hint" style="margin:2px 2px 8px">符合 ${list.length} 個動作</div>
      <div>${rows}</div>
      <button class="btn primary" id="pdone" style="position:sticky; bottom:0; width:100%; margin-top:14px; padding:13px">加入所選 (${picked.size})</button>
    `);
    const pq=$("#pq");
    pq.oninput=e=>{ q=e.target.value; const pos=pq.selectionStart; draw();
      const np=$("#pq"); if(np){ np.focus(); np.setSelectionRange(pos,pos); } };
    document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{ fCat=b.dataset.fc; draw(); });
    document.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{ fTag=b.dataset.ft; draw(); });
    document.querySelectorAll("[data-p]").forEach(cb2=>cb2.onchange=()=>{
      if(cb2.checked) picked.add(cb2.dataset.p); else picked.delete(cb2.dataset.p);
      $("#pdone").textContent=`加入所選 (${picked.size})`;
    });
    $("#pclose").onclick=()=>cb([]);
    $("#pdone").onclick=()=>{ cb([...picked]); };
  }
  draw();
}

/* ---------------- FAB ---------------- */
$("#fab").onclick=()=>{ if(TAB==="menus") openMenuForm(null); else openExerciseForm(null); };

/* ---------------- Tab 切換 ---------------- */
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{ TAB=b.dataset.tab; render(); });

/* ---------------- 匯出 / 匯入 ---------------- */
async function urlToDataUrl(url){
  const blob=await (await fetch(url)).blob();
  return await new Promise((ok,fail)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=fail; r.readAsDataURL(blob); });
}
// 備份檔把圖片轉回 base64 內嵌,這樣備份才是完整的
$("#btnExport").onclick=async ()=>{
  const btn=$("#btnExport"); btn.disabled=true; btn.textContent="匯出中…";
  try{
    const exercises=[];
    for(const e of DB.exercises){
      const c={...e};
      if(c.imageData && !c.imageData.startsWith("data:")){ try{ c.imageData=await urlToDataUrl(c.imageData); }catch(_){ c.imageData=""; } }
      exercises.push(c);
    }
    const blob=new Blob([JSON.stringify({exercises, menus:DB.menus},null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download="fitness-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
    URL.revokeObjectURL(url);
  }finally{ btn.disabled=false; btn.textContent="匯出"; }
};
$("#btnImport").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ()=>{
    let d; try{ d=JSON.parse(r.result); }catch(err){ alert("讀取失敗"); return; }
    if(!(d.exercises&&d.menus)){ alert("檔案格式不正確"); return; }
    if(!confirm("匯入會取代雲端上現有的所有動作與菜單,確定?")) return;
    setBanner("匯入中…");
    const oldEx=DB.exercises.slice(), oldMenuIds=DB.menus.map(m=>m.id);
    try{
      await bulkInsert(normalizeLegacy(d));      // 先寫入新的,成功後才刪舊的,中途失敗不會弄丟資料
      if(oldMenuIds.length){ const x=await sb.from("menus").delete().in("id",oldMenuIds); if(x.error) throw x.error; }
      if(oldEx.length){ const x=await sb.from("exercises").delete().in("id",oldEx.map(e=>e.id)); if(x.error) throw x.error; }
      const paths=oldEx.map(e=>e.imagePath).filter(Boolean);
      if(paths.length) await sb.storage.from(BUCKET).remove(paths);
      DB=await loadAll(); writeCache(); setBanner(""); render();
    }catch(err){ setBanner(""); alert("匯入失敗:"+errMsg(err)); }
  };
  r.readAsText(f); e.target.value="";
};

/* ---------------- 登入 / 同步 / 啟動 ---------------- */
function setBanner(t){ const b=$("#banner"); b.textContent=t||""; b.hidden=!t; }
function showLogin(msg){ $("#login").classList.add("open"); $("#lgErr").textContent=msg||""; }
const seededKey = () => "fitness_seeded_"+USER.id;

async function startApp(){
  const cached=readCache();
  if(cached) DB=cached;
  render();                                   // 先用上次的資料畫出來,讓畫面立刻有東西
  setBanner("同步中…");
  try{
    let data=await loadAll();
    const empty=!data.exercises.length && !data.menus.length;
    if(empty && !localStorage.getItem(seededKey())){
      setBanner("第一次登入,建立資料中…");
      await firstTimeSetup();
      data=await loadAll();
    }
    if(data.exercises.length || data.menus.length) localStorage.setItem(seededKey(),"1");
    DB=data; writeCache(); setBanner("");
  }catch(err){
    setBanner(cached ? "離線中:顯示上次的資料,暫時無法儲存" : "無法讀取雲端資料:"+errMsg(err));
  }
  render();
}

$("#loginForm").onsubmit=async ev=>{
  ev.preventDefault();
  const btn=$("#lgBtn"); btn.disabled=true; btn.textContent="登入中…"; $("#lgErr").textContent="";
  const {data,error}=await sb.auth.signInWithPassword({ email:$("#lgEmail").value.trim(), password:$("#lgPass").value });
  btn.disabled=false; btn.textContent="登入";
  if(error){ $("#lgErr").textContent="登入失敗:"+errMsg(error); return; }
  USER=data.user; $("#lgPass").value=""; $("#login").classList.remove("open");
  await startApp();
};
$("#btnLogout").onclick=async ()=>{
  if(!confirm("確定登出?")) return;
  await sb.auth.signOut({scope:"local"});      // 只登出這台裝置,不影響其他裝置
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  USER=null; DB={exercises:[],menus:[]}; $("#app").innerHTML=""; setBanner(""); showLogin();
};

async function boot(){
  if(!window.supabase){ showLogin("無法載入雲端元件,請檢查網路後重新整理"); return; }
  sb=window.supabase.createClient(SUPA_URL, SUPA_KEY);
  const {data}=await sb.auth.getSession();
  if(data && data.session){ USER=data.session.user; await startApp(); }
  else showLogin();
}
boot();
</script>
